name: Release

on:
  push:
    tags: ["v*"]
  # A release published from the GitHub web page creates its tag there; build and attach to it.
  release:
    types: [published]

# Publishing from the web page can fire both events for the same tag; build it once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Read-only by default; only the job that publishes the release can write.
permissions:
  contents: read

env:
  # Every target is one self-contained executable with its native libraries inside.
  PUBLISH_FLAGS: >-
    -c Release --self-contained -p:PublishSingleFile=true
    -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
    -p:DebugType=none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The Yubico SDK's native shims, used by the PIN protocol cross-check, link against libpcsclite.
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite1
      - run: dotnet test -c Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $flags = "$env:PUBLISH_FLAGS" -split " "
          dotnet publish src/YubiVault.App -r win-x64 @flags -p:Version=$version -o out/app
          dotnet publish src/YubiVault.Cli -r win-x64 @flags -p:Version=$version -o out/cli
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/app/YubiVault.exe, out/cli/yubivault-cli.exe, LICENSE, README.md dist/
          New-Item -ItemType Directory upload | Out-Null
          Compress-Archive dist/* "upload/YubiVault-$version-win-x64.zip"
          Copy-Item out/app/YubiVault.exe "upload/YubiVault-$version-win-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: upload/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install nfpm (.deb and .rpm)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Publish and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/YubiVault.App -r ${{ matrix.rid }} $PUBLISH_FLAGS -p:Version=$version -o out/app
          dotnet publish src/YubiVault.Cli -r ${{ matrix.rid }} $PUBLISH_FLAGS -p:Version=$version -o out/cli
          mkdir upload && cd upload
          ../packaging/linux/package.sh "$version" ${{ matrix.rid }} ../out/app ../out/cli

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: upload/*

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/YubiVault.App -r ${{ matrix.rid }} $PUBLISH_FLAGS -p:Version=$version -o out/app
          dotnet publish src/YubiVault.Cli -r ${{ matrix.rid }} $PUBLISH_FLAGS -p:Version=$version -o out/cli
          mkdir upload && cd upload
          ../packaging/macos/package.sh "$version" ${{ matrix.rid }} ../out/app ../out/cli

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: upload/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: dotnet workload install android

      # Every release is signed with the same key, or Android refuses to install it over the last one.
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are not set." && exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          # The version code only ever grows: 1.2.3 → 10203.
          code=$((major * 10000 + minor * 100 + patch))
          keystore="$RUNNER_TEMP/release.keystore"
          # Spaces and line breaks picked up when pasting the secret are not part of the key.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (see docs/releasing.md)." && exit 1
          fi
          dotnet publish src/YubiVault.Android -c Release -p:AndroidSdkDirectory=$ANDROID_HOME \
            -p:ApplicationDisplayVersion=$version -p:ApplicationVersion=$code \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias=yubivault \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD \
            -o out
          rm -f "$keystore"
          mkdir upload
          cp out/*-Signed.apk "upload/YubiVault-$version-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: upload/*

  release:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: upload
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd upload
          sha256sum * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .
          # The apps install an update only if this list carries the release key's signature (Ed25519).
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set." && exit 1
          fi
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f "$key"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Already published from the web page: attach the files to it.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "YubiVault $version" \
              --generate-notes $prerelease *
          fi
