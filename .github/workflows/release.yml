name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/YubiVault.App -c Release -r win-x64 -p:Version=$version -o out/app
          dotnet publish src/YubiVault.Cli -c Release -r win-x64 -p:Version=$version -o out/cli
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/app/YubiVault.exe, out/cli/yubivault-cli.exe, LICENSE, README.md dist/
          Compress-Archive dist/* "YubiVault-$version-win-x64.zip"
          Copy-Item out/app/YubiVault.exe "YubiVault-$version-win-x64.exe"
          Get-FileHash "YubiVault-$version-win-x64.*" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $prerelease = if ($version.StartsWith("0.")) { "--prerelease" } else { "" }
          gh release create "${{ github.ref_name }}" --title "YubiVault $version" --generate-notes $prerelease `
            "YubiVault-$version-win-x64.zip" "YubiVault-$version-win-x64.exe" SHA256SUMS.txt
